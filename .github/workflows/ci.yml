name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Security audit
        run: cargo audit

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: shellcheck install.sh demo/record.sh demo/stage.sh demo/drive-demo.sh demo/drive-mcp.sh

  # Exercises action.yml against a locally built binary, so the published
  # action cannot silently break when doctor's output format changes.
  action:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Build portview
        run: |
          cargo build --release
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      # A clean runner should be diagnosable without failing the job.
      - name: Run the action
        id: doctor
        uses: ./
        with:
          install: 'false'
          fail-on: 'never'

      - name: Outputs must be well-formed
        run: |
          set -euo pipefail
          echo "count=${{ steps.doctor.outputs.count }}"
          echo "errors=${{ steps.doctor.outputs.errors }}"
          echo "warnings=${{ steps.doctor.outputs.warnings }}"
          echo '${{ steps.doctor.outputs.findings }}' | jq empty
          # count must be an integer and equal errors + warnings
          total=$(( ${{ steps.doctor.outputs.errors }} + ${{ steps.doctor.outputs.warnings }} ))
          if [ "$total" -ne "${{ steps.doctor.outputs.count }}" ]; then
            echo "count does not equal errors + warnings"
            exit 1
          fi

      - name: A deliberate connection leak must be detected
        run: |
          set -euo pipefail
          # ingest.js leaks 16 CLOSE_WAIT sockets on :7000 — see demo/README.md.
          node demo/services/ingest.js &
          sleep 3
          findings=$(portview doctor --json)
          echo "$findings" | jq -e '[.[] | select(.check == "stale_connections")] | length > 0' \
            || { echo "doctor missed a real connection leak"; echo "$findings"; exit 1; }

  build:
    needs: quality

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64
            # Covered by the `quality` job, which runs the suite on Linux.
            test: false
          - target: x86_64-apple-darwin
            os: macos-14
            name: darwin-x86_64
            # Cross-compiled on an arm64 runner; binaries are not runnable here.
            test: false
          - target: aarch64-apple-darwin
            os: macos-14
            name: darwin-aarch64
            test: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x86_64
            test: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # The platform modules (src/windows.rs, src/macos.rs) are `#[cfg]`-gated,
      # so their tests cannot run in the Linux-only `quality` job. Without this
      # they are compiled but never executed on any runner.
      - name: Test
        if: matrix.test
        run: cargo test --target ${{ matrix.target }}

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          ./target/${{ matrix.target }}/release/portview --version
          ./target/${{ matrix.target }}/release/portview || true

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          .\target\${{ matrix.target }}\release\portview.exe --version
          .\target\${{ matrix.target }}\release\portview.exe ; exit 0
        shell: pwsh
