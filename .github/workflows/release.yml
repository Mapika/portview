name: Release

on:
  push:
    tags:
      # Full versions only. The GitHub Action published from this repo needs a
      # moving major tag (v2) that users pin with `uses: mapika/portview@v2`,
      # and a bare 'v*' pattern would fire a whole release build every time that
      # tag was repointed.
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit

  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-aarch64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-x86_64-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-aarch64-musl
          - target: x86_64-apple-darwin
            os: macos-14
            name: darwin-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            name: darwin-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: contains(matrix.target, 'aarch64-unknown-linux') || contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          PACKAGES=""
          if [[ "$TARGET" == *"aarch64"*"gnu"* ]]; then
            PACKAGES="gcc-aarch64-linux-gnu"
          elif [[ "$TARGET" == "x86_64"*"musl"* ]]; then
            PACKAGES="musl-tools"
          elif [[ "$TARGET" == "aarch64"*"musl"* ]]; then
            PACKAGES="musl-tools gcc-aarch64-linux-gnu"
          fi
          sudo apt-get install -y $PACKAGES
        env:
          TARGET: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc

      - name: Smoke test (Unix)
        if: "!contains(matrix.target, 'aarch64-unknown-linux') && runner.os != 'Windows'"
        run: |
          ./target/${{ matrix.target }}/release/portview --version
          ./target/${{ matrix.target }}/release/portview || true

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          .\target\${{ matrix.target }}\release\portview.exe --version
          .\target\${{ matrix.target }}\release\portview.exe ; exit 0
        shell: pwsh

      - name: Package completions and man page
        if: matrix.name == 'linux-x86_64'
        run: |
          OUT_DIR=$(find target -path '*/portview-*/out' -type d | head -1)
          mkdir -p dist-extras
          cp -r "$OUT_DIR/completions" dist-extras/
          cp -r "$OUT_DIR/man" dist-extras/
          tar czf portview-completions.tar.gz -C dist-extras completions man

      - name: Upload extras
        if: matrix.name == 'linux-x86_64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portview-completions
          path: portview-completions.tar.gz

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../portview-${{ matrix.name }}.tar.gz portview
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target\${{ matrix.target }}\release\portview.exe -DestinationPath portview-${{ matrix.name }}.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portview-${{ matrix.name }}
          path: |
            portview-${{ matrix.name }}.tar.gz
            portview-${{ matrix.name }}.zip

  release:
    needs: [audit, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum portview-*.tar.gz portview-*.zip > SHA256SUMS
        # Note: portview-completions.tar.gz is included in the glob above

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            portview-*.tar.gz
            portview-*.zip
            SHA256SUMS
          generate_release_notes: true

  # Runs after `release`, so a failure on any build target stops the crate from
  # going out. That ordering matters: a GitHub release can be deleted, but a
  # crates.io version can never be — only yanked.
  publish-crate:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - name: Check the token is configured
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set, so the crate cannot be published."
            echo "::error::Create a token at https://crates.io/settings/tokens (scope: publish-update)"
            echo "::error::then: gh secret set CARGO_REGISTRY_TOKEN --repo Mapika/portview"
            exit 1
          fi

      - name: Tag must match every version we declare
        id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)

          # Three files carry the version and all are bumped by hand, so check
          # them together — flake.nix and server.json are otherwise never
          # validated and would drift silently.
          flake=$(grep -m1 'version = "' flake.nix | cut -d'"' -f2)
          server=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          server_pkg=$(python3 -c "import json;print(json.load(open('server.json'))['packages'][0]['version'])")

          fail=0
          for pair in "Cargo.toml:$manifest" "flake.nix:$flake" \
                      "server.json:$server" "server.json packages[0]:$server_pkg"; do
            file="${pair%%:*}"; value="${pair##*:}"
            if [ "$value" != "$tag" ]; then
              echo "::error::${file} says ${value} but the tag is v${tag}"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

          # Publishing the wrong version is unfixable, so refuse on a mismatch
          # rather than shipping whatever the manifest happened to say.
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag is v${tag} but Cargo.toml says ${manifest}"
            exit 1
          fi
          echo "version=${tag}" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already on crates.io
        id: existing
        run: |
          set -euo pipefail
          version='${{ steps.check.outputs.version }}'
          # crates.io requires a User-Agent.
          body=$(curl -fsSL -H 'User-Agent: portview-release-workflow' \
                   https://crates.io/api/v1/crates/portview/versions || echo '')
          if printf '%s' "$body" | grep -q "\"num\":\"${version}\""; then
            echo "portview ${version} is already published; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to crates.io
        if: steps.existing.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  # Lists portview in the official MCP Registry, which is how MCP clients and
  # directories discover servers.
  #
  # Runs after publish-crate on purpose: the registry verifies ownership by
  # fetching the crate's README from crates.io and looking for the `mcp-name:`
  # token, so the version must already be there.
  publish-mcp:
    needs: [publish-crate]
    runs-on: ubuntu-latest
    permissions:
      # OIDC proves this repo owns the io.github.mapika/* namespace, so no
      # long-lived token needs to exist as a secret.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Wait for the crate README to appear on crates.io
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Ownership verification reads the rendered README, which lags the
          # publish by a little. Poll rather than race it.
          for _ in $(seq 1 20); do
            if curl -fsSL -H 'User-Agent: portview-release-workflow' \
                 "https://crates.io/api/v1/crates/portview/${version}" >/dev/null 2>&1; then
              echo "crates.io has ${version}"
              sleep 15
              exit 0
            fi
            sleep 15
          done
          echo "::error::portview ${version} did not appear on crates.io in time"
          exit 1

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish

  update-homebrew:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download checksums
        run: |
          gh release download "$GITHUB_REF_NAME" --repo Mapika/portview --pattern SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse checksums
        id: sha
        run: |
          echo "darwin_aarch64=$(grep 'darwin-aarch64.tar.gz' SHA256SUMS | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "darwin_x86_64=$(grep 'darwin-x86_64.tar.gz' SHA256SUMS | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_aarch64_musl=$(grep 'linux-aarch64-musl.tar.gz' SHA256SUMS | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_x86_64_musl=$(grep 'linux-x86_64-musl.tar.gz' SHA256SUMS | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Mapika/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA_DARWIN_AARCH64: ${{ steps.sha.outputs.darwin_aarch64 }}
          SHA_DARWIN_X86_64: ${{ steps.sha.outputs.darwin_x86_64 }}
          SHA_LINUX_AARCH64_MUSL: ${{ steps.sha.outputs.linux_aarch64_musl }}
          SHA_LINUX_X86_64_MUSL: ${{ steps.sha.outputs.linux_x86_64_musl }}
        run: |
          cat > Formula/portview.rb << EOF
          class Portview < Formula
            desc "A diagnostic-first port viewer. See what's on your ports, then act on it."
            homepage "https://github.com/Mapika/portview"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/Mapika/portview/releases/download/v#{version}/portview-darwin-aarch64.tar.gz"
                sha256 "${SHA_DARWIN_AARCH64}"
              else
                url "https://github.com/Mapika/portview/releases/download/v#{version}/portview-darwin-x86_64.tar.gz"
                sha256 "${SHA_DARWIN_X86_64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/Mapika/portview/releases/download/v#{version}/portview-linux-aarch64-musl.tar.gz"
                sha256 "${SHA_LINUX_AARCH64_MUSL}"
              else
                url "https://github.com/Mapika/portview/releases/download/v#{version}/portview-linux-x86_64-musl.tar.gz"
                sha256 "${SHA_LINUX_X86_64_MUSL}"
              end
            end

            def install
              bin.install "portview"
            end

            test do
              assert_match "portview", shell_output("#{bin}/portview --version")
            end
          end
          EOF
          sed -i 's/^          //' Formula/portview.rb

      - name: Commit and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/portview.rb
          git commit -m "Update portview to ${VERSION}"
          git push

