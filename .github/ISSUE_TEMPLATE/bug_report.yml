name: Bug Report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: portview version
      description: Output of `portview --version`
      placeholder: "portview 1.2.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS version
      placeholder: "Ubuntu 24.04 / macOS 15.2 / Windows 11"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug. Include any error messages.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Run `portview watch --docker`
        2. Press 'd' on a container row
        3. ...
