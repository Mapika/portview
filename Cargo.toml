[package]
name = "portview"
version = "2.0.0"
edition = "2024"
description = "A diagnostic-first port viewer. See what's on your ports, then act on it."
license = "MIT"
repository = "https://github.com/mapika/portview"
keywords = ["port", "process", "diagnostic", "network", "cli"]
categories = ["command-line-utilities"]
exclude = ["*.mp4", "aur/", ".github/", "demo/", "action.yml"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ratatui = "0.30"
crossterm = "0.29"

[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
